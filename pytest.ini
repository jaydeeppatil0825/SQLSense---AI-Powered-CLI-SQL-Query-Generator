[pytest]
testpaths = tests
addopts = -ra --strict-markers --basetemp=.pytest_tmp
norecursedirs =
    .git
    .venv
    .pytest_cache
    .hypothesis
    .pytest_tmp
    .pytest_tmp*
    tests/temp_pytest_full
markers =
    unit: fast in-process tests with no external services
    integration: multi-component tests that still use local fakes/mocks by default
    regression: tests locking current supported behavior or a fixed bug
    live: tests requiring external services, real databases, or live environment setup
    legacy: obsolete diagnostic tests for removed architecture; not authoritative
    mysql: tests that exercise or model MySQL-specific behavior
    frontend_contract: backend gateway contract used by the frontend
filterwarnings =
    default
