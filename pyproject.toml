[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlsense"
version = "0.1.0"
description = "Deterministic natural-language-to-SQL planning and execution"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "chromadb==1.5.9",
    "cryptography==49.0.0",
    "fastapi==0.139.0",
    "matplotlib==3.11.0",
    "numpy==2.5.1",
    "pydantic==2.13.4",
    "PyMySQL==1.1.1",
    "python-dotenv==1.0.1",
    "redis==6.4.0",
    "requests==2.34.2",
    "sentence-transformers==5.6.0",
    "SQLAlchemy==2.0.36",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "hypothesis==6.156.4",
    "mysql-connector-python==9.7.0",
    "pandas==3.0.3",
    "pytest==8.3.4",
]
ai = [
    "torch==2.13.0",
    "transformers==5.13.0",
]

[project.scripts]
sqlsense = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api_gateway*",
    "core*",
    "db*",
    "infrastructure*",
    "kb_pipeline*",
    "query_pipeline*",
    "semantic*",
    "sql_pipeline*",
    "utils*",
    "vector_store*",
]
namespaces = true
